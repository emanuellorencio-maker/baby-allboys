name: Validar fuente FEFI (manual)
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validar:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: pip install beautifulsoup4==4.14.3
      - run: python scripts/actualizar_clausura.py --check
