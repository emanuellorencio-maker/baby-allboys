name: Actualizar datos FEFI
on:
  workflow_dispatch:
  schedule:
    - cron: "0 12 * * *"
permissions:
  contents: write
concurrency:
  group: actualizar-fefi
  cancel-in-progress: false
jobs:
  actualizar:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
        with:
          ref: main
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Dependencias del lector oficial
        run: pip install beautifulsoup4==4.14.3
      - name: Validar y actualizar las cuatro tiras
        run: |
          python scripts/test_clausura.py
          python scripts/actualizar_clausura.py
      - name: Publicar únicamente datos deportivos
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- data/c data/i data/mat1 data/mat4 data/d data/historico/apertura-2026 data/clubes-direcciones.json data/estado-fefi.json fixture_c.json fixture_i.json fixture_mat1.json fixture_mat4.json resultados_c.json resultados_i.json resultados_mat1.json resultados_mat4.json tabla_c.json tabla_i.json tabla_mat1.json tabla_mat4.json direcciones_c.json direcciones_i.json direcciones_mat1.json direcciones_mat4.json
          if git diff --cached --quiet; then
            echo "Sin cambios deportivos"
            exit 0
          fi
          git diff --cached --check
          git commit -m "Actualizar Clausura 2026 desde FEFI"
          git pull --rebase origin main
          git push origin main
